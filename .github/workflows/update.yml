name: Update predictions

on:
  schedule:
    # 11:30 PM Central  = 04:30 UTC (daylight time) / 05:30 UTC (standard time)
    # 4:30 AM Central   = 09:30 UTC (daylight time) / 10:30 UTC (standard time)
    # pipeline/gate.py lets exactly one firing per slot through.
    - cron: "30 4 * * *"
    - cron: "30 5 * * *"
    - cron: "30 9 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Backtest weeks of the current season to build (e.g. 1-4). Leave blank normally."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-predictions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Check schedule window
        id: gate
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python -m pipeline.gate >> "$GITHUB_OUTPUT"

      - name: Restore data cache
        if: steps.gate.outputs.run != 'skip'
        uses: actions/cache@v4
        with:
          path: cache
          key: nfl-cache-${{ github.run_id }}
          restore-keys: nfl-cache-

      - name: Run predictions + grading
        if: steps.gate.outputs.run != 'skip'
        run: |
          if [ -n "${{ github.event.inputs.backfill }}" ]; then
            python -m pipeline.build --run "${{ steps.gate.outputs.run }}" --backfill "${{ github.event.inputs.backfill }}"
          else
            python -m pipeline.build --run "${{ steps.gate.outputs.run }}"
          fi

      - name: Commit updated data
        if: steps.gate.outputs.run != 'skip'
        run: |
          git config user.name "absinthe-bot"
          git config user.email "absinthe-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update predictions ($(TZ=America/Chicago date '+%a %b %d %I:%M %p CT'))"
            git push
          fi
