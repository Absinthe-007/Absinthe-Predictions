name: Update predictions

on:
  schedule:
    # Wakes every 15 minutes on the (UTC) days that cover Thursday, Sunday and Monday
    # Central time. pipeline/gate.py decides what actually runs:
    #   predict -> 5 hours before that day's first kickoff (Thu / Sun / Mon only)
    #   grade   -> 11:30 PM Central on Thu / Sun / Mon
    # Every other wake-up exits in a few seconds without changing anything.
    - cron: "*/15 * * * 0,1,2,4,5"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [manual, predict, grade]
        default: manual
      backfill:
        description: "Backtest weeks of the current season to build (e.g. 1-4). Leave blank normally."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-predictions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check schedule
        id: gate
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          out=$(python3 -m pipeline.gate)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            out="run=${{ github.event.inputs.mode }}"
          fi
          echo "$out" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run != 'skip'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.gate.outputs.run != 'skip'
        run: pip install -r requirements.txt

      - name: Restore data cache
        if: steps.gate.outputs.run != 'skip'
        uses: actions/cache@v4
        with:
          path: cache
          key: nfl-cache-${{ github.run_id }}
          restore-keys: nfl-cache-

      - name: Run pipeline
        if: steps.gate.outputs.run != 'skip'
        run: |
          if [ -n "${{ github.event.inputs.backfill }}" ]; then
            python -m pipeline.build --mode "${{ steps.gate.outputs.run }}" --backfill "${{ github.event.inputs.backfill }}"
          else
            python -m pipeline.build --mode "${{ steps.gate.outputs.run }}"
          fi

      - name: Commit updated data
        if: steps.gate.outputs.run != 'skip'
        run: |
          git config user.name "absinthe-bot"
          git config user.email "absinthe-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "${{ steps.gate.outputs.run }}: $(TZ=America/Chicago date '+%a %b %d %I:%M %p CT')"
            git pull --rebase --autostash || true
            git push
          fi
